    <script>
      // Intercept attempts to overwrite window.fetch to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { console.warn('Intercepted attempt to overwrite window.fetch'); },
            configurable: true
          });
        } catch (e) {
          console.error('Failed to intercept window.fetch', e);
        }
      })();
    </script>
